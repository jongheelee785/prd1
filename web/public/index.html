<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>LVC 시나리오 설계 도우미</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 작전 상황판 — 상단 탭(작성·검토·수정·카탈로그), 좌측 시나리오 목록, 우측 작업면(조건 · 지형도 · 단계 카드) */
:root {
  --bg: #e9ede8;
  --surface: #fbfcfa;
  --sunk: #dfe5df;
  --ink: #17222a;
  --muted: #55636b;
  --line: #ccd5ce;
  --accent: #b5501d;
  --accent-ink: #ffffff;
  --accent-soft: #f6e3d6;
  --focus: #2a62a6;
  --L: #4c6d2a; --L-bg: #e2ebd5;
  --V: #2a62a6; --V-bg: #dbe6f4;
  --C: #7a4c9d; --C-bg: #ebe0f3;
  --ok: #2d7743; --ok-bg: #dcefe1;
  --warn: #9a5f06; --warn-bg: #f7ead0;
  --info: #2a62a6; --info-bg: #dbe6f4;
  --vio: #7a4c9d; --vio-bg: #ebe0f3;
  --neu: #5f6a70; --neu-bg: #e2e7e4;
  --sea: #c6dbe2; --sea-deep: #afccd6; --land: #e6e8d6; --beach: #ebdbb0; --cliff: #b2a58d;
  --urban: #c3c7ca; --road: #f8f5ea; --contour: #b9b99a; --map-ink: #34413a; --grid: rgba(30, 55, 45, .13);
  --bf: #1d5cb0; --bf-bg: #cfe0f6; --rf: #c2262e; --rf-bg: #f6d3d4;
  --f-sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171a; --surface: #182024; --sunk: #0d1214; --ink: #e3eae6; --muted: #98a6a0; --line: #2b363a;
    --accent: #e07b42; --accent-ink: #1a0d05; --accent-soft: #3a2518; --focus: #7fb0ea;
    --L: #9cc06a; --L-bg: #25321a; --V: #77abe8; --V-bg: #18283b; --C: #be98df; --C-bg: #2c2139;
    --ok: #78c98f; --ok-bg: #18301f; --warn: #e5b05a; --warn-bg: #352712; --info: #77abe8; --info-bg: #18283b;
    --vio: #be98df; --vio-bg: #2c2139; --neu: #a3aeaa; --neu-bg: #242d30;
    --sea: #1a313b; --sea-deep: #152831; --land: #252b22; --beach: #463f2b; --cliff: #4f4a3e;
    --urban: #3a4146; --road: #59594a; --contour: #4b4d3a; --map-ink: #cdd6cf; --grid: rgba(200, 220, 210, .08);
    --bf: #7fb2f0; --bf-bg: #17304f; --rf: #f07a7f; --rf-bg: #4a1c1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171a; --surface: #182024; --sunk: #0d1214; --ink: #e3eae6; --muted: #98a6a0; --line: #2b363a;
  --accent: #e07b42; --accent-ink: #1a0d05; --accent-soft: #3a2518; --focus: #7fb0ea;
  --L: #9cc06a; --L-bg: #25321a; --V: #77abe8; --V-bg: #18283b; --C: #be98df; --C-bg: #2c2139;
  --ok: #78c98f; --ok-bg: #18301f; --warn: #e5b05a; --warn-bg: #352712; --info: #77abe8; --info-bg: #18283b;
  --vio: #be98df; --vio-bg: #2c2139; --neu: #a3aeaa; --neu-bg: #242d30;
  --sea: #1a313b; --sea-deep: #152831; --land: #252b22; --beach: #463f2b; --cliff: #4f4a3e;
  --urban: #3a4146; --road: #59594a; --contour: #4b4d3a; --map-ink: #cdd6cf; --grid: rgba(200, 220, 210, .08);
  --bf: #7fb2f0; --bf-bg: #17304f; --rf: #f07a7f; --rf-bg: #4a1c1f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 14px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
a { color: var(--info); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.mono { font-family: var(--f-mono); }
.lab { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.brand .tagline { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1 1 auto; min-width: 0; }
.tab { border: 1px solid transparent; background: none; padding: 7px 12px; border-radius: var(--r); cursor: pointer; white-space: nowrap; color: var(--muted); font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--ink); background: var(--sunk); }
.tab[aria-current="page"] { color: var(--ink); background: var(--bg); border-color: var(--line); }
.tab .sid { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.tab .badge { background: var(--accent); color: var(--accent-ink); border-radius: 10px; font-size: 11px; padding: 0 6px; font-family: var(--f-mono); }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.who select { padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }

.banner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 7px; font-size: 13px; background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid var(--line); }

/* shell */
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; max-width: 1560px; margin: 0 auto; }
.side { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 8px; min-width: 0; max-height: calc(100vh - 96px); overflow: auto; }
.side-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.side-head h2 { font-size: 13px; }
.side-list { display: flex; flex-direction: column; gap: 6px; }
.sitem { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 9px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.sitem:hover { border-color: var(--muted); }
.sitem[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.sitem .t { font-weight: 500; font-size: 13px; line-height: 1.35; }
.sitem .m { font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); }
.side-empty { font-size: 13px; color: var(--muted); padding: 10px; border: 1px dashed var(--line); border-radius: var(--r); }
#view { min-width: 0; display: flex; flex-direction: column; gap: 16px; }

/* generic */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel > h2 { font-size: 15px; margin-bottom: 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); border-color: var(--accent); }
.btn.ok { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn.wide { width: 100%; justify-content: center; padding: 10px; font-size: 14px; }
.btn.ghost { background: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .field .flab { font-size: 12px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea, textarea.box, input.box { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 7px 9px; width: 100%; min-width: 0; }
textarea.box, .field textarea { resize: vertical; min-height: 58px; }
.form-grid { display: grid; gap: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-작성중 { color: var(--neu); background: var(--neu-bg); }
.st-검토요청 { color: var(--info); background: var(--info-bg); }
.st-수정요청 { color: var(--warn); background: var(--warn-bg); }
.st-재검토 { color: var(--vio); background: var(--vio-bg); }
.st-승인 { color: var(--ok); background: var(--ok-bg); }
.chip { font-family: var(--f-mono); font-weight: 600; font-size: 11.5px; padding: 1px 7px; border-radius: 4px; display: inline-flex; gap: 5px; align-items: center; }
.chip small { font-family: var(--f-sans); font-weight: 500; font-size: 11px; }
.m-L { color: var(--L); background: var(--L-bg); }
.m-V { color: var(--V); background: var(--V-bg); }
.m-C { color: var(--C); background: var(--C-bg); }
.mini { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; padding: 0 4px; border-radius: 3px; }

/* make */
.make { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.result { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.sc-head { display: flex; flex-direction: column; gap: 10px; }
.sc-title { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.sc-title h2 { font-size: 19px; letter-spacing: -.01em; }
.sc-title .ver { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 500; }
.src { font-size: 11.5px; font-family: var(--f-mono); color: var(--muted); }
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.map-wrap { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.map { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: var(--r); background: var(--land); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); align-items: center; }
.cards { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* map svg */
.m-land { fill: var(--land); } .m-sea { fill: var(--sea); } .m-deep { fill: var(--sea-deep); } .m-beach { fill: var(--beach); }
.m-cliff { fill: var(--cliff); } .m-urban { fill: var(--urban); } .m-road { fill: none; stroke: var(--road); stroke-width: 5; stroke-linecap: round; }
.m-roadline { fill: none; stroke: var(--contour); stroke-width: 1; stroke-dasharray: 4 4; }
.m-contour { fill: none; stroke: var(--contour); stroke-width: 1.1; }
.m-edge { fill: none; stroke: var(--map-ink); stroke-width: 1; stroke-dasharray: 2 3; opacity: .55; }
.m-river { fill: none; stroke: var(--sea); stroke-width: 9; stroke-linecap: round; }
.m-obst { stroke: var(--map-ink); stroke-width: 1.4; opacity: .7; }
.m-grid { stroke: var(--grid); stroke-width: 1; }
.m-gridtxt { fill: var(--map-ink); opacity: .55; font-family: var(--f-mono); font-size: 9px; }
.m-txt { fill: var(--map-ink); font-family: var(--f-sans); font-size: 11px; opacity: .75; }
.m-title { fill: var(--map-ink); font-family: var(--f-sans); font-size: 12px; font-weight: 700; }
.m-plate { fill: var(--surface); opacity: .85; }
.m-north { fill: var(--map-ink); }
.m-route { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 5; opacity: .85; }
.m-ptlabel { fill: var(--ink); font-family: var(--f-sans); font-size: 10.5px; font-weight: 500; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.mk { cursor: pointer; }
.mk-dot { stroke: var(--surface); stroke-width: 2; }
.mk-L .mk-dot { fill: var(--L); } .mk-V .mk-dot { fill: var(--V); } .mk-C .mk-dot { fill: var(--C); }
.mk-ring { fill: none; stroke: var(--accent); stroke-width: 2.5; opacity: 0; }
.mk.on .mk-ring { opacity: 1; }
.f-blue .fr { fill: var(--bf-bg); stroke: var(--bf); stroke-width: 1.6; }
.f-red .fr { fill: var(--rf-bg); stroke: var(--rf); stroke-width: 1.6; }
.f-blue .gl { stroke: var(--bf); fill: none; stroke-width: 1.4; } .f-red .gl { stroke: var(--rf); fill: none; stroke-width: 1.4; }
.f-blue .gd { fill: var(--bf); } .f-red .gd { fill: var(--rf); }
.f-size { font-family: var(--f-mono); font-size: 8.5px; font-weight: 600; text-anchor: middle; }
.f-blue .f-size { fill: var(--bf); } .f-red .f-size { fill: var(--rf); }
.f-lab { font-family: var(--f-sans); font-size: 9.5px; font-weight: 500; text-anchor: middle; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.m-assault { fill: none; stroke: var(--bf); stroke-width: 3; opacity: .8; }
.m-arrowhead { fill: var(--bf); }
.m-red-axis { fill: none; stroke: var(--rf); stroke-width: 2; stroke-dasharray: 3 3; opacity: .75; }
.m-red-head { fill: var(--rf); }
.m-forcenote { fill: var(--map-ink); font-family: var(--f-sans); font-size: 10px; }
.sym { display: inline-flex; vertical-align: middle; }
.doctrine { display: flex; flex-direction: column; gap: 6px; }
.doctrine ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.doctrine li b { font-weight: 600; }
.equip { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: center; }
.equip svg { width: 120px; height: auto; }
.equip p { margin: 0; font-size: 13px; }
.doctrine ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.inj-wrap { overflow-x: auto; }
.inj { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.inj th, .inj td { border-top: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
.inj th { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.inj td.cite { color: var(--muted); white-space: nowrap; font-size: 11.5px; }
.srcs { margin: 0; padding-left: 20px; font-size: 12.5px; display: flex; flex-direction: column; gap: 3px; }
/* 사후검토 */
.mk.future { opacity: .22; }
.aar-ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.aar-ctl input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
.aar-ctl .pos { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.tl { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.tl-i { flex: 1 0 92px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px 7px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; font-size: 12px; border-top: 3px solid var(--line); }
.tl-i small { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.tl-i[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: -1px; }
.tl-i.r-success { border-top-color: var(--ok); } .tl-i.r-partial { border-top-color: var(--warn); } .tl-i.r-fail { border-top-color: var(--accent); }
.aar-form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.aar-form .full { grid-column: 1 / -1; }
.ev-list { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.ev-list label { display: flex; gap: 6px; align-items: flex-start; }
.recs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rec { border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: var(--r); padding: 7px 9px; background: var(--bg); }
.rec.rk-fix { border-left-color: var(--accent); } .rec.rk-keep { border-left-color: var(--ok); } .rec.rk-check { border-left-color: var(--muted); }
.rec-top { display: flex; gap: 7px; align-items: baseline; font-size: 13px; }
.rec .rk { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; padding: 0 5px; border-radius: 3px; background: var(--sunk); white-space: nowrap; }
.rec.rk-fix .rk { background: var(--accent-soft); color: var(--accent); }
.rec p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
.rec .cites { margin-top: 3px; font-size: 11.5px; color: var(--muted); }
@media (max-width: 720px) { .aar-form { grid-template-columns: minmax(0, 1fr); } }
.eq-body { fill: var(--bf-bg); stroke: var(--bf); stroke-width: 1.6; }
.eq-solid { fill: var(--bf); opacity: .85; }
.eq-wheel { fill: var(--surface); stroke: var(--bf); }
.eq-line { fill: none; stroke: var(--bf); opacity: .7; }
.eq-txt { fill: var(--bf); font-family: var(--f-sans); font-size: 8px; text-anchor: middle; }
.mk-num { fill: var(--surface); font-family: var(--f-mono); font-size: 11px; font-weight: 600; text-anchor: middle; pointer-events: none; }

/* phase card */
.phase { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 14px; display: flex; flex-direction: column; gap: 9px; min-width: 0; cursor: default; transition: border-color .15s; }
.phase.is-active { border-color: var(--accent); }
.ph-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.ph-no { font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; color: var(--accent); }
.ph-head h3 { font-size: 15px; }
.ph-when { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.ph-head .lvc { margin-left: auto; display: flex; gap: 4px; }
.ph-content { margin: 0; }
.ph-sec { display: flex; flex-direction: column; gap: 3px; }
.ph-sec p { margin: 0; color: var(--ink); font-size: 13px; }
.tech { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.tech li { border-left: 2px solid var(--accent); padding: 2px 0 2px 10px; }
.tech-top { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.tech-top b { font-weight: 600; font-size: 13px; }
.tech li p { margin: 1px 0 0; font-size: 13px; }
.tag-concept { font-size: 10.5px; padding: 0 5px; border-radius: 3px; color: var(--warn); background: var(--warn-bg); }
.refs { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.threat { font-size: 12.5px; background: var(--accent-soft); border-radius: 4px; padding: 6px 9px; }
.ph-loc { font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); }

/* comments */
.cmts { display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); padding-top: 9px; }
.cmt { background: var(--bg); border-radius: 4px; padding: 7px 9px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }

async function applyPhaseChange(sc, i, np, meta) {

function ruleRevision(sc, p, text) {
  const np = clone(p);

  const notes = [];
  // "X 대신 Y" → X 제외, Y 추가. "Y가 더 적합" → 언급 안 된 첫 기술을 Y로 교체.
  const parts = text.split("대신");
  let add = hitsIn(text), remove = [];
  if (parts.length > 1) { remove = hitsIn(parts[0]); add = hitsIn(parts.slice(1).join(" ")); }

  add.forEach(h => {
    if (np.tech.some(t => t.id === h.id)) return;
    if (np.tech.length >= 3) np.tech.pop();
    np.tech.push({ id: h.id, name: h.name, reason: `검토 의견 반영: ${h.use}` }); notes.push(`${h.name} 추가`);
  });

  if (modeHit && np.lvc[0] !== modeHit[1]) { np.lvc = [modeHit[1], ...np.lvc.filter(m => m !== modeHit[1])].slice(0, 2); np.lvcReason = `검토 의견에 따라 ${MODES[modeHit[1]]}(${modeHit[1]})을 주 방식으로 바꾼다. ` + np.lvcReason; notes.push(`주 방식 ${modeHit[1]}`); }

}

function mapSVG(field, phases, active, upto = null) {
  const F = FIELDS[field], used = {};
  const pos = phases.map((p, i) => { const pt = pointFor(F, p.loc, i); const n = (used[pt.key] = (used[pt.key] || 0) + 1); return { x: pt.x + (n - 1) * 22, y: pt.y - (n - 1) * 6, pt }; });
  let grid = "";
  for (let x = 60, k = 1; x < 600; x += 60, k++) grid += `<line class="m-grid" x1="${x}" y1="0" x2="${x}" y2="380"/><text class="m-gridtxt" x="${x + 3}" y="374">${pad(k)}</text>`;
  for (let y = 60, k = 0; y < 380; y += 60, k++) grid += `<line class="m-grid" x1="0" y1="${y}" x2="600" y2="${y}"/><text class="m-gridtxt" x="3" y="${y - 3}">${"ABCDEF"[k]}</text>`;
  const labels = [...new Map(pos.map(q => [q.pt.key, q.pt])).values()].map(pt => { const right = pt.side ? pt.side === "left" : pt.x > 430; return `<text class="m-ptlabel" x="${right ? pt.x - 18 : pt.x + 18}" y="${pt.y + 24}" text-anchor="${right ? "end" : "start"}">${esc(pt.name)}</text>`; }).join("");

  const walked = upto == null ? pos : pos.slice(0, upto + 1);

  const marks = pos.map((q, i) => `<g class="mk mk-${phases[i].lvc[0] || "L"} ${active === i ? "on" : ""} ${upto != null && i > upto ? "future" : ""}" data-i="${i}" data-act="focus:${i}" transform="translate(${q.x} ${q.y})"><title>PH-${pad(i + 1)} ${esc(phases[i].name)}</title><circle class="mk-ring" r="18"/><circle class="mk-dot" r="12"/><text class="mk-num" y="4">${i + 1}</text></g>`).join("");
  return `<svg class="map" viewBox="0 0 600 380" role="img" aria-label="${esc(F.name)} 지형도와 단계별 위치"><rect class="m-land" width="600" height="380"/>${F.draw()}${grid}
    <rect class="m-plate" x="8" y="8" width="${Math.max(F.name.length, 10) * 12 + 120}" height="22" rx="3"/><text class="m-title" x="16" y="23">${esc(F.name)} · ${esc(F.desc)}</text>

    ${forcesSVG(field)}${route}${labels}${marks}</svg>`;
}

      const reason = str(S.drafts["rj:" + a1]); if (!reason) return toast("미반영 사유를 입력하세요.");
      if (await write(() => Store.update("comments", a1, { state: "rejected", reason, handledBy: S.author, handledAt: now() }))) S.rejecting = null;
      break;
    }
    case "markDone": await write(() => Store.update("comments", a1, { state: "applied", appliedVersion: sc?.version || 1, handledBy: S.author, handledAt: now() })); break;
    case "hist": S.histSel = S.histSel === a1 ? null : a1; break;
    case "pdf": if (sc) exportPdf(sc); return;
    case "catAdd": S.catEdit = { id: uid("t"), draft: { id: "", name: "", use: "", modes: ["L"], kw: "", alias: [], concept: false } }; S.catEdit.draft.id = S.catEdit.id; S.catDel = null; break;
    case "catEdit": S.catEdit = { id: a1, draft: clone(catById(a1)) }; S.catDel = null; break;
    case "catCancel": S.catEdit = null; S.catDel = null; S.catReset = false; break;
    case "catDel": S.catDel = a1; S.catEdit = null; break;
    case "catSave": {
      const d = S.catEdit.draft; if (!str(d.name)) return toast("기술 이름을 입력하세요."); if (!d.modes.length) return toast("영역을 하나 이상 고르세요.");
      d.name = str(d.name); d.alias = [...new Set([...(d.alias || []), d.name])];
      const items = catalog().some(c => c.id === d.id) ? catalog().map(c => (c.id === d.id ? d : c)) : [...catalog(), d];
      if (await write(() => Store.set("config", "catalog", { items, updatedAt: now(), by: S.reviewer }))) { S.catEdit = null; toast("카탈로그를 저장했습니다."); }
      break;
    }
    case "catDelYes": {
      const items = catalog().filter(c => c.id !== a1);
      if (!items.length) return toast("기술이 하나 이상 있어야 합니다.");
      if (await write(() => Store.set("config", "catalog", { items, updatedAt: now(), by: S.reviewer }))) S.catDel = null;
      break;
    }
    case "catReset": S.catReset = true; break;
    case "catResetYes": if (await write(() => Store.set("config", "catalog", { items: CATALOG0, updatedAt: now(), by: S.reviewer }))) S.catReset = false; break;
    default: return;
  }
  renderNow();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.bind) {
    const k = t.dataset.bind;
    if (k === "author") { S.author = t.value; lsSet("lvc-author", t.value); return renderNow(); }
    if (k === "reviewer") { S.reviewer = t.value; ssSet("lvc-reviewer", t.value); return renderNow(); }
    if (k === "op") { const prev = OPS[S.form.op], next = OPS[t.value]; if (!str(S.form.goal) || S.form.goal === prev.goal) S.form.goal = next.goal; S.form.field = next.field; S.form.site = next.site; ["unit", "enemy", "threat", "days"].forEach(k => { if (next[k]) S.form[k] = next[k]; }); }
    S.form[k] = t.value;
    if (t.tagName === "SELECT" || k === "days") { if (t.tagName === "SELECT") renderNow(); else { S.dirty = true; } }
    return;
  }
  if (t.dataset.draft) { S.drafts[t.dataset.draft] = t.value; return; }
  if (t.hasAttribute("data-aar-step")) { aarPlay(false); S.aarStep = Number(t.value); return renderNow(); }
  if (t.dataset.aar || t.dataset.aarInj) {
    const sc = cur(); if (!sc) return;
    const d = aarDraft(sc, S.aarStep, true);
    if (t.dataset.aarInj) { const id = t.dataset.aarInj; d.injects = t.checked ? [...new Set([...(d.injects || []), id])] : (d.injects || []).filter(x => x !== id); return renderNow(); }
    d[t.dataset.aar] = t.value;
    if (t.tagName === "SELECT") return renderNow();
    S.dirty = true; return;
  }
  if (S.editing) {
    const d = S.editing.draft;
    if (t.dataset.edit) { if (t.dataset.edit === "commentId") S.editing.commentId = t.value; else d[t.dataset.edit] = t.value; }
    if (t.dataset.editLvc) { const m = t.dataset.editLvc; d.lvc = t.checked ? [...d.lvc.filter(x => x !== m), m] : d.lvc.filter(x => x !== m); }
    if (t.dataset.editTid) { const c = catById(t.value); d.tech[Number(t.dataset.editTid)] = { ...d.tech[Number(t.dataset.editTid)], id: t.value, name: c?.name || t.value }; }
    if (t.dataset.editTr) d.tech[Number(t.dataset.editTr)].reason = t.value;
  }
  if (S.catEdit) {
    const d = S.catEdit.draft;
    if (t.dataset.cat) d[t.dataset.cat] = t.value;
    if (t.dataset.catMode) { const m = t.dataset.catMode; d.modes = t.checked ? [...new Set([...d.modes, m])].sort((a, b) => "LVC".indexOf(a) - "LVC".indexOf(b)) : d.modes.filter(x => x !== m); }
    if (t.hasAttribute("data-cat-concept")) d.concept = t.checked;
  }
});
document.addEventListener("change", e => { if (e.target.type === "checkbox") e.target.dispatchEvent(new Event("input", { bubbles: true })); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "rvCode") { e.preventDefault(); document.querySelector('[data-act="rvLogin"]')?.click(); } });
document.addEventListener("focusout", () => setTimeout(() => { if (S.dirty && !isTyping()) renderNow(); }, 0));

/* ───────────── 시작 ───────────── */
async function boot() {
  renderNow();
  let user = null;
  if (window.claude?.use) {
    const [db, u, sm, dl] = await Promise.all(["db", "user", "sample", "downloads"].map(n => window.claude.use(n).catch(() => null)));
    DB = db; user = u; sample = sm; downloads = dl;
  }
  if (DB) { Store = Remote; S.mode = "shared"; try { if ((await user?.can?.("data.write")) === false) S.readOnly = true; } catch {} }
  else { Store = Local; S.mode = "local"; }
  showBanner();
  let pending = 5;
  const onData = key => list => { S[key] = list; if (pending > 0 && --pending === 0) S.loaded = true; if (key !== "config" && pending <= 0) S.loaded = true; render(); };
  ["scenarios", "comments", "history", "config", "aar"].forEach(c => Store.subscribe(c, onData(c)));
}
boot();
